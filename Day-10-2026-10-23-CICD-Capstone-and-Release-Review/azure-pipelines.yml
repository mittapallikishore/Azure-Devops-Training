
trigger: none
pr: none

pool:
  vmImage: ubuntu-latest

variables:
  NODE_VERSION: '20'

stages:
  - stage: Validate
    displayName: 'Build and Validate'
    jobs:
      - job: BuildAndTest
        displayName: 'Install, Build and Test'
        steps:
          - checkout: self
            clean: true

          - task: NodeTool@0
            inputs:
              versionSpec: '$(NODE_VERSION)'
            displayName: 'Set up Node.js'

          - script: |
              cd "$(Build.SourcesDirectory)/azure-website-project"

              if [ -f package-lock.json ]; then
                npm ci
              elif [ -f package.json ]; then
                npm install
              else
                echo "ERROR: package.json not found in azure-website-project."
                exit 1
              fi
            displayName: 'Install dependencies'

          - script: |
              cd "$(Build.SourcesDirectory)/azure-website-project"

              if [ -f package.json ]; then
                npm run build --if-present
                npm test --if-present
              fi
            displayName: 'Build and test website'

          - script: |
              APP_DIR="$(Build.SourcesDirectory)/azure-website-project"
              RELEASE_DIR="$(Build.ArtifactStagingDirectory)/release"

              if [ ! -d "$APP_DIR" ]; then
                echo "ERROR: azure-website-project folder not found."
                exit 1
              fi

              mkdir -p "$RELEASE_DIR"
              cp -R "$APP_DIR/." "$RELEASE_DIR/"

              printf "Build ID: %s\nCommit: %s\n" \
                "$(Build.BuildId)" "$(Build.SourceVersion)" \
                > "$RELEASE_DIR/release-info.txt"

              echo "Website release artifact prepared."
              echo "Training documentation folders were excluded."
            displayName: 'Prepare website-only artifact'

          - task: PublishPipelineArtifact@1
            inputs:
              targetPath: '$(Build.ArtifactStagingDirectory)/release'
              artifact: 'Website-Release'
              publishLocation: 'pipeline'
            displayName: 'Publish website artifact'

  - stage: DeploymentGate
    displayName: 'Deployment Approval Gate'
    dependsOn: Validate
    condition: succeeded()
    jobs:
      - job: Approval
        displayName: 'Manual approval before deployment'
        pool: server
        timeoutInMinutes: 1440
        steps:
          - task: ManualValidation@1
            timeoutInMinutes: 1440
            inputs:
              notifyUsers: ''
              approvers: ''
              allowApproversToApproveTheirOwnRuns: true
              instructions: 'Review the successful validation run and Website-Release artifact before approving.'
              onTimeout: 'reject'
