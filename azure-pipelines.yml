
trigger:
  branches:
    include:
      - main
      - feature/*
  paths:
    include:
      - '**'

pool:
  vmImage: ubuntu-latest

steps:
  - checkout: self

  - script: |
      test -f index.html
      echo "HTML file found successfully"
    displayName: Validate HTML file

  - task: PublishPipelineArtifact@1
    displayName: Publish website artifact
    inputs:
      targetPath: '$(Build.SourcesDirectory)'
      artifact: website
      publishLocation: pipeline
