
trigger: none
pr: none

pool:
  vmImage: windows-latest

steps:
  - checkout: self

  - task: PowerShell@2
    displayName: Validate project folder
    inputs:
      targetType: inline
      script: |
        $path = "$(Build.SourcesDirectory)/Day-04-2026-10-15-CI-Pipeline/DevOps-Capstone"

        if (!(Test-Path $path)) {
          throw "DevOps-Capstone folder not found."
        }

        Write-Host "Project folder validated successfully."

  - task: PowerShell@2
    displayName: Create demonstration artifact
    inputs:
      targetType: inline
      script: |
        $out = "$(Build.ArtifactStagingDirectory)/success"
        New-Item -ItemType Directory -Path $out -Force | Out-Null
        "Pipeline validation succeeded." |
          Set-Content "$out/result.txt"

  - task: PublishPipelineArtifact@1
    displayName: Publish success artifact
    inputs:
      targetPath: '$(Build.ArtifactStagingDirectory)/success'
      artifact: 'Success-Demo'
