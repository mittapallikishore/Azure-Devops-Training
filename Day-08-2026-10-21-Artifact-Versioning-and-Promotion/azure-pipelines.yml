
trigger: none
pr: none

pool:
  vmImage: ubuntu-24.04

variables:
  artifactName: 'Website-Release'

stages:
  - stage: Build
    displayName: Build and Publish Artifact
    jobs:
      - job: BuildWebsite
        steps:
          - checkout: self
            clean: true

          - task: UseNode@1
            displayName: Install Node.js
            inputs:
              version: '20.x'

          - script: npm ci
            displayName: Install dependencies
            workingDirectory: azure-website-project

          - script: node --check server.js
            displayName: Validate JavaScript
            workingDirectory: azure-website-project

          - script: npm test
            displayName: Run unit tests
            workingDirectory: azure-website-project

          - script: |
              mkdir -p "$(Build.ArtifactStagingDirectory)/website"
              cp -r azure-website-project/index.html azure-website-project/server.js "$(Build.ArtifactStagingDirectory)/website/"
              printf "Build ID: %s\nCommit: %s\n" "$(Build.BuildId)" "$(Build.SourceVersion)" > "$(Build.ArtifactStagingDirectory)/website/release-info.txt"
            displayName: Prepare versioned release files

          - task: PublishPipelineArtifact@1
            displayName: Publish website release artifact
            inputs:
              targetPath: '$(Build.ArtifactStagingDirectory)/website'
              artifact: '$(artifactName)'
