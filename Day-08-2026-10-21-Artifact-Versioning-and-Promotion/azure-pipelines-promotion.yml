
trigger: none
pr: none

pool:
  vmImage: ubuntu-24.04

stages:
  - stage: Test
    displayName: Test Environment
    jobs:
      - job: ValidateTestArtifact
        displayName: Validate release in Test
        steps:
          - checkout: none

          - task: DownloadPipelineArtifact@2
            displayName: Download successful build artifact
            inputs:
              buildType: specific
              project: '$(System.TeamProject)'
              definition: '11'
              buildVersionToDownload: specific
              pipelineId: '114'
              artifactName: Website-Release
              targetPath: '$(Pipeline.Workspace)/Website-Release'

          - script: |
              set -e
              test -f "$(Pipeline.Workspace)/Website-Release/index.html"
              test -f "$(Pipeline.Workspace)/Website-Release/server.js"
              test -f "$(Pipeline.Workspace)/Website-Release/release-info.txt"
              cat "$(Pipeline.Workspace)/Website-Release/release-info.txt"
              echo "Test environment artifact validation passed."
            displayName: Verify Test artifact

  - stage: Production
    displayName: Production Environment
    dependsOn: Test
    condition: succeeded()
    jobs:
      - job: ValidateProductionArtifact
        displayName: Validate release in Production
        steps:
          - checkout: none

          - task: DownloadPipelineArtifact@2
            displayName: Download the same release artifact
            inputs:
              buildType: specific
              project: '$(System.TeamProject)'
              definition: '11'
              buildVersionToDownload: specific
              pipelineId: '114'
              artifactName: Website-Release
              targetPath: '$(Pipeline.Workspace)/Website-Release'

          - script: |
              set -e
              test -f "$(Pipeline.Workspace)/Website-Release/index.html"
              test -f "$(Pipeline.Workspace)/Website-Release/server.js"
              test -f "$(Pipeline.Workspace)/Website-Release/release-info.txt"
              cat "$(Pipeline.Workspace)/Website-Release/release-info.txt"
              echo "Production environment artifact validation passed."
            displayName: Verify Production artifact
