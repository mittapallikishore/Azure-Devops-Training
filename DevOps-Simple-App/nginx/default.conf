map $http_x_api_key $api_key_valid {
    default 0;
    "devops-training-key-2026" 1;
}

limit_req_zone $binary_remote_addr zone=api_limit:10m rate=2r/s;
limit_req_zone $binary_remote_addr zone=product_search_limit:10m rate=1r/s;

log_format api_gateway escape=json
    '{"time":"$time_iso8601",'
    '"request_id":"$request_id",'
    '"client_ip":"$remote_addr",'
    '"method":"$request_method",'
    '"uri":"$request_uri",'
    '"status":"$status",'
    '"request_time":"$request_time",'
    '"upstream_addr":"$upstream_addr",'
    '"upstream_status":"$upstream_status",'
    '"upstream_response_time":"$upstream_response_time",'
    '"user_agent":"$http_user_agent"}';

server {
    listen 80;
    server_name localhost;

    access_log /var/log/nginx/access.log api_gateway;
    add_header X-Request-ID $request_id always;

    location = /api/products/search {
        if ($api_key_valid = 0) {
            return 401;
        }

        limit_req zone=product_search_limit burst=1 nodelay;
        limit_req_status 429;

        proxy_pass http://web:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-ID $request_id;
    }

    location /api/users {
        if ($api_key_valid = 0) { return 401; }
        limit_req zone=api_limit burst=2 nodelay;
        limit_req_status 429;
        proxy_pass http://web:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-ID $request_id;
    }

    location /api/products {
        if ($api_key_valid = 0) { return 401; }
        limit_req zone=api_limit burst=2 nodelay;
        limit_req_status 429;
        proxy_pass http://web:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-ID $request_id;
    }

    location /api/orders {
        if ($api_key_valid = 0) { return 401; }
        limit_req zone=api_limit burst=2 nodelay;
        limit_req_status 429;
        proxy_pass http://web:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-ID $request_id;
    }

    location /health {
        proxy_pass http://web:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
    }

    location / {
        proxy_pass http://web:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
    }
}
