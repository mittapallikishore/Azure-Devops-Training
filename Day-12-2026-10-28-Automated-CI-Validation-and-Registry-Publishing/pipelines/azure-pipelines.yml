
- stage: ImagePublication
  displayName: '4. Publish Image (Sandbox Simulation)'
  dependsOn: ImageBuild
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
  jobs:
  - job: SimulatePublication
    displayName: 'Validate packaged image for publication'
    pool:
      vmImage: $(vmImage)
    steps:
    - checkout: none

    - task: DownloadPipelineArtifact@2
      displayName: 'Download the built image artifact'
      inputs:
        buildType: 'current'
        artifactName: 'day12-container-image'
        targetPath: '$(Pipeline.Workspace)/day12-container-image'

    - script: |
        set -euo pipefail
        docker load --input "$(Pipeline.Workspace)/day12-container-image/day12-image.tar"
        docker image inspect "$(imageName):$(Build.BuildId)" >/dev/null
        docker image inspect "$(imageName):$(Build.SourceVersion)" >/dev/null
        echo "SANDBOX SIMULATION ONLY: image archive loaded and both tags verified."
        echo "Image: $(imageName)"
        echo "Build ID: $(Build.BuildId)"
        echo "Commit SHA: $(Build.SourceVersion)"
        echo "No registry login or remote image push was performed."
      displayName: 'Verify packaged image and simulate publication'
