
parameters:
  - name: runFailingTest
    type: boolean
    default: false

steps:
  - task: UseNode@1
    displayName: Install Node.js 20
    inputs:
      version: '20.x'

  - script: npm ci
    displayName: Install dependencies
    workingDirectory: azure-website-project

  - script: node --check server.js
    displayName: Static syntax check
    workingDirectory: azure-website-project

  - script: npm test
    displayName: Run existing unit tests
    workingDirectory: azure-website-project

    
  
  - ${{ if eq(parameters.runFailingTest, true) }}:
    - script: INTENTIONAL_TEST_FAILURE=true node tests/test.js
      displayName: Run intentional failing test
      workingDirectory: azure-website-project

  - ${{ else }}:
    - script: node tests/test.js
      displayName: Run passing demonstration test
      workingDirectory: azure-website-project


