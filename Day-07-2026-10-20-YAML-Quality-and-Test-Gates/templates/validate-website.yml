parameters:
  - name: runFailingTest
    type: boolean
    default: false

steps:
  - task: UseNode@1
    displayName: Install Node.js 20
    inputs:
      version: '20.x'

  - script: npm ci
    displayName: Install dependencies
    workingDirectory: azure-website-project

  - script: node --check server.js
    displayName: Static syntax check
    workingDirectory: azure-website-project

  - script: npm test
    displayName: Run HTML quality tests
    workingDirectory: azure-website-project

  - ${{ if eq(parameters.runFailingTest, true) }}:
    - script: |
        echo "Demonstrating an intentional pipeline failure"
        exit 1
      displayName: Intentional failure demonstration

