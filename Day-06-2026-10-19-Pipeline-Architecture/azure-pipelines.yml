
trigger:
  branches:
    include:
      - main
      - feature/*
      - test/*

pr: none

pool:
  vmImage: windows-latest

steps:
  - checkout: self
    clean: true

  - task: PowerShell@2
    displayName: Validate repository structure
    inputs:
      targetType: inline
      script: |
        $project = "$(Build.SourcesDirectory)/Day-04-2026-10-15-CI-Pipeline/DevOps-Capstone"

        if (!(Test-Path $project)) {
          throw "Day 4 project folder was not found."
        }

        Write-Host "Repository validation passed."
        Write-Host "Project folder: $project"

  - task: PowerShell@2
    displayName: Create validation artifact
    inputs:
      targetType: inline
      script: |
        $out = "$(Build.ArtifactStagingDirectory)/validation"
        New-Item -ItemType Directory -Path $out -Force | Out-Null
        "Repository validation passed." |
          Set-Content "$out/result.txt"

  - task: PublishPipelineArtifact@1
    displayName: Publish validation artifact
    inputs:
      targetPath: '$(Build.ArtifactStagingDirectory)/validation'
      artifact: 'Day6-Validation'
