trigger: none

pr: none

pool:
  vmImage: ubuntu-24.04

variables:
  projectPath: 'Day-13-2026-10-29-Deployment-Promotion-and-Rollback/Final-Mini-Project'
  imageRepository: 'day13-final-app'
  containerRegistry: 'day12ci331776.azurecr.io'
  imageTag: '$(Build.BuildId)'
  appName: 'day13-deploy-sandbox-20261029'
  resourceGroup: 'azurewebapp1_group'

stages:

# STAGE 1: CHECKOUT AND BUILD VALIDATION
- stage: CheckoutAndValidate
  displayName: '1. Checkout and Build Validation'
  jobs:
  - job: Validate
    steps:
    - checkout: self

    - bash: |
        set -e
        APP="$(Build.SourcesDirectory)/$(projectPath)/app"

        test -f "$APP/package.json"
        test -f "$APP/package-lock.json"
        test -f "$APP/Dockerfile"

        echo "Application files validated successfully."
      displayName: 'Validate source files'


# STAGE 2: AUTOMATED TESTS
- stage: AutomatedTests
  displayName: '2. Automated Tests'
  dependsOn: CheckoutAndValidate
  jobs:
  - job: Test
    steps:
    - checkout: self

    - task: NodeTool@0
      inputs:
        versionSpec: '22.x'

    - bash: |
        set -e
        cd "$(Build.SourcesDirectory)/$(projectPath)/app"
        npm ci
        npm test
      displayName: 'Install dependencies and run tests'


# STAGE 3: BUILD DOCKER IMAGE
- stage: BuildDockerImage
  displayName: '3. Build Docker Image'
  dependsOn: AutomatedTests
  jobs:
  - job: Build
    steps:
    - checkout: self

    - bash: |
        set -e

        APP="$(Build.SourcesDirectory)/$(projectPath)/app"
        IMAGE="$(containerRegistry)/$(imageRepository):$(imageTag)"

        docker build -t "$IMAGE" "$APP"

        mkdir -p "$(Pipeline.Workspace)/image"
        docker save "$IMAGE" \
          -o "$(Pipeline.Workspace)/image/image.tar"

        echo "Docker image built: $IMAGE"
      displayName: 'Build and save Docker image'

    - task: PublishPipelineArtifact@1
      inputs:
        targetPath: '$(Pipeline.Workspace)/image'
        artifact: 'docker-image'
        publishLocation: 'pipeline'
      displayName: 'Publish image artifact'


# STAGE 4: PUBLISH IMAGE TO ACR
- stage: PublishDockerImage
  displayName: '4. Publish Image to ACR'
  dependsOn: BuildDockerImage
  jobs:
  - job: Publish
    steps:
    - task: DownloadPipelineArtifact@2
      inputs:
        buildType: 'current'
        artifactName: 'docker-image'
        targetPath: '$(Pipeline.Workspace)/image'

    - bash: |
        set -e
        docker load \
          -i "$(Pipeline.Workspace)/image/image.tar"
      displayName: 'Load previously built image'

    - task: Docker@2
      displayName: 'Login to Azure Container Registry'
      inputs:
        command: login
        containerRegistry: 'sc-day12-acr'

    - bash: |
        set -e

        IMAGE="$(containerRegistry)/$(imageRepository):$(imageTag)"

        docker push "$IMAGE"

        echo "Published image: $IMAGE"
      displayName: 'Push image to ACR'


# STAGE 5: DEPLOY TO AZURE APP SERVICE
- stage: DeployToAppService
  displayName: '5. Deploy to Azure App Service'
  dependsOn: PublishDockerImage
  jobs:
  - job: Deploy
    steps:
    - task: AzureCLI@2
      name: CapturePrevious
      displayName: 'Capture previous working image'
      inputs:
        azureSubscription: 'day13-sandbox-connection'
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          set -e

          CURRENT_CONFIG=$(az webapp config show \
            --name "$(appName)" \
            --resource-group "$(resourceGroup)" \
            --query linuxFxVersion \
            --output tsv)

          PREVIOUS_IMAGE="${CURRENT_CONFIG#DOCKER|}"

          if [ -z "$PREVIOUS_IMAGE" ] || [ "$PREVIOUS_IMAGE" = "$CURRENT_CONFIG" ]; then
            echo "No previous Docker image was found."
            PREVIOUS_IMAGE=""
          else
            echo "Previous image: $PREVIOUS_IMAGE"
          fi

          echo "##vso[task.setvariable variable=previousImage;isOutput=true]$PREVIOUS_IMAGE"

    - task: AzureWebAppContainer@1
      displayName: 'Deploy pipeline image'
      inputs:
        azureSubscription: 'day13-sandbox-connection'
        appName: '$(appName)'
        containers: '$(containerRegistry)/$(imageRepository):$(imageTag)'


# STAGE 6: HEALTH CHECK
- stage: HealthCheck
  displayName: '6. Health Check and Verification'
  dependsOn: DeployToAppService
  jobs:
  - job: Verify
    steps:
    - bash: |
        set -e

        URL="https://day13-deploy-sandbox-20261029.azurewebsites.net/rollback-test-invalid"

        for attempt in {1..12}; do
          if curl --fail --silent --show-error --max-time 15 "$URL"; then
            echo "Health check passed."
            exit 0
          fi

          echo "Health check attempt $attempt failed."
          sleep 10
        done

        echo "ERROR: Health check failed."
        exit 1
      displayName: 'Verify deployed application'


# STAGE 7: ROLLBACK AND RECOVERY
- stage: RollbackRecovery
  displayName: '7. Rollback and Recovery'
  dependsOn:
    - DeployToAppService
    - HealthCheck
  condition: failed('HealthCheck')

  variables:
    previousImage: $[ stageDependencies.DeployToAppService.Deploy.outputs['CapturePrevious.previousImage'] ]

  jobs:
  - job: Rollback
    steps:
    - task: AzureCLI@2
      displayName: 'Restore previous working image'
      inputs:
        azureSubscription: 'day13-sandbox-connection'
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          set -e

          PREVIOUS_IMAGE="$(previousImage)"

          if [ -z "$PREVIOUS_IMAGE" ]; then
            echo "ERROR: No previous Docker image is available for rollback."
            exit 1
          fi

          echo "Restoring previous image: $PREVIOUS_IMAGE"

          az webapp config set \
            --name "$(appName)" \
            --resource-group "$(resourceGroup)" \
            --linux-fx-version "DOCKER|$PREVIOUS_IMAGE"

          az webapp restart \
            --name "$(appName)" \
            --resource-group "$(resourceGroup)"

          URL="https://day13-deploy-sandbox-20261029.azurewebsites.net/health"

          for attempt in {1..12}; do
            if curl --fail --silent --show-error --max-time 15 "$URL"; then
              echo "Rollback successful. Previous application is healthy."
              exit 0
            fi

            echo "Rollback health check attempt $attempt failed."
            sleep 10
          done

          echo "ERROR: Rollback health check failed."
          exit 1