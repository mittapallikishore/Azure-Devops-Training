
trigger:
  branches:
    include:
      - main
  paths:
    include:
      - Day-03-2026-10-14-Azure-Resources-and-Identity/DevOps-Capstone/*

pr:
  branches:
    include:
      - main

pool:
  vmImage: windows-latest

variables:
  projectPath: 'Day-03-2026-10-14-Azure-Resources-and-Identity/DevOps-Capstone'

stages:
  - stage: Validate
    displayName: Build and Validate
    jobs:
      - job: ValidateProject
        displayName: Validate Project
        steps:
          - checkout: self

          - task: PowerShell@2
            displayName: Check Project Files
            inputs:
              targetType: inline
              script: |
                $path = "$(Build.SourcesDirectory)/$(projectPath)"

                if (!(Test-Path "$path/README.md")) {
                  throw "README.md is missing"
                }

                if (!(Test-Path "$path/azure-pipelines.yml")) {
                  throw "Pipeline YAML is missing"
                }

                Write-Host "Project files validated successfully."

          - task: UseNode@1
            displayName: Install Node.js
            inputs:
              versionSpec: '20.x'

          - task: PowerShell@2
            displayName: Install Dependencies and Run Tests
            inputs:
              targetType: inline
              script: |
                $path = "$(Build.SourcesDirectory)/$(projectPath)"
                $package = Join-Path $path "package.json"

                if (Test-Path $package) {
                  Set-Location $path

                  if (Test-Path "package-lock.json") {
                    npm ci
                  } else {
                    npm install
                  }

                  if ($LASTEXITCODE -ne 0) {
                    throw "Dependency installation failed"
                  }

                  $config = Get-Content $package -Raw | ConvertFrom-Json

                  if ($config.scripts.test) {
                    npm test
                    if ($LASTEXITCODE -ne 0) {
                      throw "Tests failed"
                    }
                  } else {
                    Write-Host "No test script configured; tests skipped."
                  }
                } else {
                  Write-Host "No package.json found; Node.js tests skipped."
                }

  - stage: Publish
    displayName: Publish Artifact
    dependsOn: Validate
    condition: succeeded()
    jobs:
      - job: PublishArtifact
        displayName: Publish Capstone Files
        steps:
          - task: CopyFiles@2
            displayName: Copy Project Files
            inputs:
              SourceFolder: '$(Build.SourcesDirectory)/$(projectPath)'
              Contents: '**'
              TargetFolder: '$(Build.ArtifactStagingDirectory)/DevOps-Capstone'

          - task: PublishPipelineArtifact@1
            displayName: Publish Capstone Artifact
            inputs:
              targetPath: '$(Build.ArtifactStagingDirectory)/DevOps-Capstone'
              artifact: 'DevOps-Capstone'
