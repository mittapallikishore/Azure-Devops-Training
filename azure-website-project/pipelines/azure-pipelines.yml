
name: Build and deploy Node.js app to Azure Web App - azurewebapp1

on:
  push:
    branches:
      - main
    paths:
      - 'azure-website-project/**'
      - '.github/workflows/main_azurewebapp1.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: '22.x'
  APP_DIRECTORY: azure-website-project
  AZURE_WEBAPP_NAME: azurewebapp1

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: azure-website-project/package-lock.json

      - name: Install dependencies
        working-directory: azure-website-project
        run: npm ci

      - name: Run tests
        working-directory: azure-website-project
        run: npm test

      - name: Prepare deployment package
        run: |
          mkdir -p release-package
          cp -a azure-website-project/. release-package/
          rm -rf release-package/node_modules
          zip -qr website-${GITHUB_SHA}.zip release-package

      - name: Upload versioned release artifact
        uses: actions/upload-artifact@v4
        with:
          name: website-${{ github.sha }}
          path: website-${{ github.sha }}.zip
          if-no-files-found: error
          retention-days: 30

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: production

    steps:
      - name: Download validated release artifact
        uses: actions/download-artifact@v4
        with:
          name: website-${{ github.sha }}

      - name: Extract deployment package
        run: |
          unzip -q website-${GITHUB_SHA}.zip
          cd release-package
          zip -qr ../website-deploy.zip .

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_44EDB832A0A44564B013791D0E86F044 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_E0CAF0663280417BAECF003BD5C895B8 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_890EDB72D6114D2C95E45D313D9EC478 }}

      - name: Deploy validated package
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          slot-name: Production
          package: website-deploy.zip

      - name: Verify deployed website
        run: |
          URL="https://azurewebapp1-fga9agfwc8gce7ab.indiasouthcentral-01.azurewebsites.net"
          curl --fail --silent --show-error --location \
            --max-time 30 "$URL" -o response.html
          grep -qi '<html' response.html
          echo "Deployment smoke test passed."
